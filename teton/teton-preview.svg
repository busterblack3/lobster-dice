<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="640" viewBox="0 0 640 640">
  <!-- Social-preview lockup: preserve the original Teton mark; swap only its subtitle. -->
  <defs><clipPath id="teton-main"><rect x="70" y="58" width="500" height="310"/></clipPath></defs>
  <rect width="640" height="640" fill="#ffffff"/>
  <g clip-path="url(#teton-main)">
    <image xlink:href="teton-logo.png" x="70" y="58" width="500" height="395" preserveAspectRatio="none"/>
  </g>
  <!-- Same all-caps, centered, full-width subtitle treatment as APARTMENT SUMMIT. -->
  <!-- Original subtitle geometry: a small serif line, nearly as wide as TETON, directly below it. -->
  <text x="320" y="391" text-anchor="middle" fill="#231f20" font-family="FreeSerif, 'Times New Roman', serif" font-size="30" font-weight="400" letter-spacing="24">LOBSTER DICE</text>
</svg>
